# =====================================================================
# Eureka Server (service registry) configuration
# Dashboard: http://localhost:8761
# =====================================================================
server.port=8761
spring.application.name=eureka-server

eureka.instance.hostname=localhost

# This is the registry itself, so it must not register with / fetch from another registry.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Development setting: remove stopped services from the dashboard quickly
# instead of keeping them listed ("self-preservation").
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
