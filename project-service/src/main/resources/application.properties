# =====================================================================
# Project Service configuration
# =====================================================================
server.port=8082
spring.application.name=project-service

# Your own MySQL username/password go in application-local.properties
# (copy application-local.properties.example). That file is git-ignored,
# so your password is never committed. It is optional.
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------------------
# Database: run db/02_project_db.sql first.
# Defaults below can also be overridden with environment variables
# (DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/project_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created by the SQL scripts in /db, so Hibernate must not change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Swagger UI: http://localhost:8082/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------
# Eureka: register with the service registry (start eureka-server first).
# Dashboard: http://localhost:8761
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
