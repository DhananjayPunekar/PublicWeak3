# =====================================================================
# API Gateway configuration
# Single entry point for all clients: http://localhost:8080
# Routes are defined in config/GatewayRoutesConfig.java
# =====================================================================
server.port=8080
spring.application.name=api-gateway

# ---------------------------------------------------------------------
# Eureka: the gateway looks up user-, project- and issue-service here
# (lb://service-name routes). Start eureka-server first.
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
