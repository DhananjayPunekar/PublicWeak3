server:
  port: 8081

spring:
  application:
    name: user-service

  # Your own MySQL username/password go in application-local.yml
  # (copy application-local.yml.example). That file is git-ignored,
  # so your password is never committed. It is optional.
  config:
    import: optional:classpath:application-local.yml

  # Database: run db/01_user_db.sql first.
  # Defaults below can also be overridden with environment variables
  # (DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD).
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/user_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      # Tables are created by the SQL scripts in /db, so Hibernate must not change them.
      ddl-auto: none
    open-in-view: false
    show-sql: false

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
